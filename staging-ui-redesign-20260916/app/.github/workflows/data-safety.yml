name: MarginFlow data safety
on: [push, pull_request]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run safety:check
      - run: npm test
      - run: npm run build
# No production secrets, database changes, deployment or recovery here.
# Configure this job as required in the real repository before relying on it.
